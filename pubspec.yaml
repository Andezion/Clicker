name: game_cool
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.6.2
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/image.png"

flutter:
  uses-material-design: true
  assets:
    - assets/image.png
    - assets/image1.png
